<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <link rel="stylesheet" href="css/clock-style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 World Clock</h1>
            <p>Current time across different time zones</p>
        </header>

        <div class="controls">
            <button class="btn-add" id="addTimezoneBtn">+ Add Timezone</button>
            <button class="btn-reset" id="resetBtn">Reset to Defaults</button>
        </div>

        <div class="timezone-modal" id="timezoneModal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2>Select a Timezone</h2>
                <input type="text" id="timezoneSearch" placeholder="Search timezone..." class="search-input">
                <select id="timezoneSelect" class="timezone-select"></select>
                <button class="btn-confirm" id="confirmTimezoneBtn">Add</button>
            </div>
        </div>

        <div class="clocks-grid" id="clocksGrid">
            <!-- Clocks will be dynamically inserted here -->
        </div>
    </div>

    <script src="js/clock.js"></script>
</body>
</html>
